[project]
name = "medgemma-grounding"
version = "0.1.0"
description = "Scaffold for mechanistic interpretability research on MedGemma 1.5 visual grounding."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jupyterlab>=4.6.3",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.1",
    "torch>=2.6.0",
    "transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
